name: Release

on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip publish)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  # 新 push 取代旧的 run：false 会让一个挂死的 run 堵住后续所有发版尝试
  cancel-in-progress: true

jobs:
  # ============================================================
  # 1. 校验：版本号与发布一致性（单元测试不在 CI 跑，见 TODO R31）
  # ============================================================
  validate:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.merged == true
          && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    # 保留上限作保险：validate 曾静默挂死 1 小时无输出（testAll 已从本 job 移除，成因未结案）
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 版本校验只留 Gradle 一处实现。原先这里是第二套内联实现：规则与 checkVersion
      # 不一致（只比最新 tag、不比 versionCode 自洽与递增），且完全不管 iOS/站点声明是否跟上。
      - name: Check version & release consistency
        run: ./gradlew checkVersion checkReleaseConsistency --no-daemon --no-configuration-cache

      - name: Cleanup Gradle/Kotlin daemons
        if: always()
        shell: bash   # 统一 shell：Windows 默认 pwsh 会把 `> /dev/null` 当成 D:\dev\null 去写，直接失败
        run: |
          ./gradlew --stop || true
          case "$RUNNER_OS" in
            # Git Bash 里没有 pkill，Windows 用 taskkill；//F 是 MSYS 的转义写法
            Windows) taskkill //F //IM java.exe //T >/dev/null 2>&1 || true ;;
            *) pkill -f 'GradleDaemon|KotlinCompileDaemon|GradleWorkerMain' || true ;;
          esac

  # ============================================================
  # 2. Android 构建（与桌面端并行）
  # ============================================================
  build-android:
    needs: [validate]
    runs-on: ubuntu-latest
    env:
      HMP_BUILD_TARGET: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/hmp-unified-key.jks

      - name: Inject built-in AI API key
        run: echo "BUILT_IN_AI_API_KEY=${{ secrets.BUILT_IN_AI_API_KEY }}" >> gradle.properties

      - name: Build Android Release
        run: ./gradlew :android:app:assembleRelease :android:app:bundleRelease --no-daemon --no-configuration-cache
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-android
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 5

      - name: Cleanup Gradle/Kotlin daemons
        if: always()
        shell: bash   # 统一 shell：Windows 默认 pwsh 会把 `> /dev/null` 当成 D:\dev\null 去写，直接失败
        run: |
          ./gradlew --stop || true
          case "$RUNNER_OS" in
            # Git Bash 里没有 pkill，Windows 用 taskkill；//F 是 MSYS 的转义写法
            Windows) taskkill //F //IM java.exe //T >/dev/null 2>&1 || true ;;
            *) pkill -f 'GradleDaemon|KotlinCompileDaemon|GradleWorkerMain' || true ;;
          esac

  # ============================================================
  # 3. 桌面端构建（与 Android 并行）
  # ============================================================
  build-desktop-macos:
    needs: [validate]
    runs-on: macos-latest
    env:
      HMP_BUILD_TARGET: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build macOS DMG
        run: ./gradlew :desktop:app:packageDistributionForCurrentOS '-Phmp.release-build=true' --no-daemon --no-configuration-cache

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-desktop-macos
          path: desktop/app/build/compose/binaries/main/dmg/
          retention-days: 5

      - name: Cleanup Gradle/Kotlin daemons
        if: always()
        shell: bash   # 统一 shell：Windows 默认 pwsh 会把 `> /dev/null` 当成 D:\dev\null 去写，直接失败
        run: |
          ./gradlew --stop || true
          case "$RUNNER_OS" in
            # Git Bash 里没有 pkill，Windows 用 taskkill；//F 是 MSYS 的转义写法
            Windows) taskkill //F //IM java.exe //T >/dev/null 2>&1 || true ;;
            *) pkill -f 'GradleDaemon|KotlinCompileDaemon|GradleWorkerMain' || true ;;
          esac

  build-desktop-windows:
    needs: [validate]
    runs-on: windows-latest
    env:
      HMP_BUILD_TARGET: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset -y
          # choco 改的是机器 PATH，需显式灌进 GITHUB_PATH 才能让后续 build 步骤找到 candle/light。
          # 用通配定位，避免写死 v3.11 路径。
          $wixBin = (Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" -Recurse -Filter candle.exe -ErrorAction SilentlyContinue |
                     Select-Object -First 1).DirectoryName
          if (-not $wixBin) { throw "WiX candle.exe 未找到，MSI 打包必失败" }
          echo "$wixBin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          Write-Host "WiX bin on PATH: $wixBin"

      - name: Build Windows MSI
        shell: bash
        run: ./gradlew :desktop:app:packageDistributionForCurrentOS '-Phmp.release-build=true' --no-daemon --no-configuration-cache

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-desktop-windows
          path: desktop/app/build/compose/binaries/main/msi/
          retention-days: 5

      - name: Cleanup Gradle/Kotlin daemons
        if: always()
        shell: bash   # 统一 shell：Windows 默认 pwsh 会把 `> /dev/null` 当成 D:\dev\null 去写，直接失败
        run: |
          ./gradlew --stop || true
          case "$RUNNER_OS" in
            # Git Bash 里没有 pkill，Windows 用 taskkill；//F 是 MSYS 的转义写法
            Windows) taskkill //F //IM java.exe //T >/dev/null 2>&1 || true ;;
            *) pkill -f 'GradleDaemon|KotlinCompileDaemon|GradleWorkerMain' || true ;;
          esac

  build-desktop-linux:
    needs: [validate]
    runs-on: ubuntu-latest
    env:
      HMP_BUILD_TARGET: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg fakeroot libfuse2
          # AppImageKit 的 appimagetool 是 Compose packageAppImage 的硬依赖，CI 干净镜像里没有；
          # 不装则 Linux 打包（Deb + AppImage）必失败。它自身是个 AppImage，运行需 libfuse2。
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool
          appimagetool --version

      - name: Build Linux DEB + AppImage
        run: ./gradlew :desktop:app:packageDistributionForCurrentOS '-Phmp.release-build=true' --no-daemon --no-configuration-cache

      # 不假设 Compose 的子目录名。v7.2.1 那次事故里 packageAppImage 把产物写进了
      # main/app/（和 createDistributable 的应用目录同一处），并非 main/appimage/，
      # 而上传路径硬编码了 appimage/ —— 结果 artifact 里只有 deb，AppImage 静默丢失，
      # 一路绿灯到 release job 的断言才炸。现在改为全目录搜索 + 就地断言。
      - name: Collect Linux packages
        run: |
          set -euo pipefail
          MAIN=desktop/app/build/compose/binaries/main

          echo "=== main/ 实际布局（诊断）==="
          find "$MAIN" -maxdepth 2 \( -type d -o -type f \) | sort
          echo

          # -quit 而非 | head -1：后者会让 find 收到 SIGPIPE，在 pipefail 下直接判失败
          DEB=$(find "$MAIN" -type f -name '*.deb' -print -quit 2>/dev/null || true)
          APPIMAGE=$(find "$MAIN" -type f -name '*.AppImage' -print -quit 2>/dev/null || true)

          missing=0
          [ -n "$DEB" ] || { echo "::error::未找到 .deb"; missing=1; }
          [ -n "$APPIMAGE" ] || { echo "::error::未找到 .AppImage：$MAIN 下没有 AppImage 产物"; missing=1; }
          [ "$missing" = "0" ] || { echo "::error::Linux 产物不全，立刻失败——不让问题漂流到 release job"; exit 1; }

          mkdir -p linux-out
          cp "$DEB" linux-out/
          cp "$APPIMAGE" linux-out/
          echo "=== 将上传 ==="
          ls -lh linux-out/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-desktop-linux
          path: linux-out/
          retention-days: 5

      - name: Cleanup Gradle/Kotlin daemons
        if: always()
        shell: bash   # 统一 shell：Windows 默认 pwsh 会把 `> /dev/null` 当成 D:\dev\null 去写，直接失败
        run: |
          ./gradlew --stop || true
          case "$RUNNER_OS" in
            # Git Bash 里没有 pkill，Windows 用 taskkill；//F 是 MSYS 的转义写法
            Windows) taskkill //F //IM java.exe //T >/dev/null 2>&1 || true ;;
            *) pkill -f 'GradleDaemon|KotlinCompileDaemon|GradleWorkerMain' || true ;;
          esac

  # ============================================================
  # 4. 发布：收集产物 + 生成 Notes + 创建 Release
  # ============================================================
  release:
    needs: [build-android, build-desktop-macos, build-desktop-windows, build-desktop-linux]
    # 刻意不再让 dry_run 整个跳过本 job。
    # v7.2.1 事故的一半原因在这里：dry run 跳过 release job，于是「收集产物 + 齐全断言」
    # 这段逻辑从来没被演练过 —— dry run 全绿，正式发布才第一次跑到断言才发现 AppImage 丢了。
    # 现在 dry run 会一路跑到断言与 Notes 生成为止，只在落地 tag / Release 那一步停下。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^hmp.versionName=' gradle.properties | cut -d'=' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect and rename artifacts
        id: assets
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          mkdir -p release-assets

          # Android
          APK=$(find artifacts/build-android -name "app-release.apk" 2>/dev/null | head -1)
          [ -n "$APK" ] && cp "$APK" "release-assets/HMP-v${VERSION}-release.apk"
          AAB=$(find artifacts/build-android -name "app-release.aab" 2>/dev/null | head -1)
          [ -n "$AAB" ] && cp "$AAB" "release-assets/HMP-v${VERSION}-release.aab"

          # macOS（arm64，来自 macos-latest）
          for f in artifacts/build-desktop-macos/*.dmg; do
            [ -f "$f" ] && cp "$f" "release-assets/HMP-v${VERSION}-macos-arm64.dmg"
          done

          # Windows（x86_64）
          for f in artifacts/build-desktop-windows/*.msi; do
            [ -f "$f" ] && cp "$f" "release-assets/HMP-v${VERSION}-windows-x86_64.msi"
          done

          # Linux x86_64（deb + AppImage）
          DEB=$(find artifacts/build-desktop-linux -name "*.deb" 2>/dev/null | head -1)
          [ -n "$DEB" ] && cp "$DEB" "release-assets/HMP-v${VERSION}-linux-x86_64.deb"
          APPIMAGE=$(find artifacts/build-desktop-linux -name "*.AppImage" 2>/dev/null | head -1)
          [ -n "$APPIMAGE" ] && cp "$APPIMAGE" "release-assets/HMP-v${VERSION}-linux-x86_64.AppImage"

          ls -lh release-assets/

      # 上面的收集全是 `[ -f ... ] && cp`，某个平台产物缺失时会静默跳过、Release 照样发布成功。
      # 这里做硬断言：必需产物一个都不能少。
      - name: Assert all artifacts present
        run: |
          VERSION=$(grep '^hmp.versionName=' gradle.properties | cut -d'=' -f2)
          missing=0
          for f in "HMP-v${VERSION}-release.apk" "HMP-v${VERSION}-macos-arm64.dmg" \
                   "HMP-v${VERSION}-windows-x86_64.msi" \
                   "HMP-v${VERSION}-linux-x86_64.deb" "HMP-v${VERSION}-linux-x86_64.AppImage"; do
            if [ ! -s "release-assets/$f" ]; then
              echo "::error::缺产物：$f"
              missing=1
            fi
          done
          [ "$missing" = "0" ] || { echo "::error::产物不齐全，拒绝发布（宁可不发，也不发一个缺平台/架构的 Release）"; exit 1; }
          echo "OK 必需产物齐全（Android + macOS arm64 + Windows x86_64 + Linux x86_64，共 5 个文件）"

      - name: Generate SHA256 checksums
        run: |
          cd release-assets
          sha256sum HMP-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Build release notes
        id: notes
        run: |
          VERSION=$(grep '^hmp.versionName=' gradle.properties | cut -d'=' -f2)
          TAG="v${VERSION}"

          # 正文 = ROADMAP 的本次版本条目（单一事实来源）。原来 Notes 只由 commit 前缀
          # 分类生成，与 ROADMAP 各说各话，发布说明里的完成度口径没人负责。
          # 条目里的 `>` 引用块是给内部看的（进度注记、文档指针），不进公开发布说明。
          {
            echo "## Hearable Music Player ${TAG}"
            echo
            awk -v head="### v${VERSION} (" 'index($0, head)==1 {f=1; next} /^### v[0-9]/ {if (f) exit} f' ROADMAP.md \
              | grep -v '^> '
            cat <<TABLE

          ---

          ### 📥 产物
          | 平台 | 文件 |
          |------|------|
          | Android | \`HMP-v${VERSION}-release.apk\`（\`.aab\` 走 Google Play） |
          | macOS (Apple Silicon / arm64) | \`HMP-v${VERSION}-macos-arm64.dmg\` |
          | Windows | \`HMP-v${VERSION}-windows-x86_64.msi\` |
          | Linux (x86_64) | \`HMP-v${VERSION}-linux-x86_64.deb\` / \`.AppImage\` |
          | 校验和 | \`SHA256SUMS.txt\`（\`sha256sum -c SHA256SUMS.txt\`） |

          > iOS 不随本次发布提供安装包：需 macOS + Xcode 源码自构建，见 README「安装步骤」。
          TABLE
          } > body.md

          # commit 分类降级为附录
          PREV_TAG=$(git tag --sort=-v:refname | head -1)
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "$PREV_TAG..HEAD" --pretty=format:"%s" --no-merges)
          else
            COMMITS="Initial release"
          fi
          FEATURES=$(echo "$COMMITS" | grep -iE "^(feat|feature)" | sed 's/^/- /' || true)
          FIXES=$(echo "$COMMITS" | grep -iE "^fix" | sed 's/^/- /' || true)
          PERF=$(echo "$COMMITS" | grep -iE "^(perf|optimize|refactor)" | sed 's/^/- /' || true)
          OTHERS=$(echo "$COMMITS" | grep -viE "^(feat|feature|fix|perf|optimize|refactor)" | sed 's/^/- /' || true)
          {
            echo
            echo "---"
            echo
            echo "### 工程提交（附录，自动生成）"
            [ -n "$FEATURES" ] && echo "#### ✨ Features" && echo "$FEATURES" && echo ""
            [ -n "$FIXES" ] && echo "#### 🐛 Fixes" && echo "$FIXES" && echo ""
            [ -n "$PERF" ] && echo "#### ⚡ Performance & Refactoring" && echo "$PERF" && echo ""
            [ -n "$OTHERS" ] && echo "#### 📦 Other" && echo "$OTHERS" && echo ""
          } > appendix.md
          wc -l body.md appendix.md

      - name: Create tag and GitHub Release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^hmp.versionName=' gradle.properties | cut -d'=' -f2)
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 幂等：原来先 git tag 再 gh release create，任一步中途失败后重跑必死于
          # "tag already exists"，只能人工删 tag。现在存在即复用。
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "tag ${TAG} 已存在 → 复用（通常是上次发布中途失败后重跑）"
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

          cat body.md appendix.md > notes.md

          if gh release view "${TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "${TAG}" --repo "$GITHUB_REPOSITORY" --title "${TAG}" --notes-file notes.md
            gh release upload "${TAG}" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "${TAG}" --repo "$GITHUB_REPOSITORY" --title "${TAG}" \
              --notes-file notes.md release-assets/*
          fi

      # dry run 的终点：收集、断言、Notes 都已真实跑过，到此收手。
      # 这里贴出产物清单，让人一眼确认「只差发布」。
      - name: Dry run — stop before publishing
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "dry_run=true：产物齐全断言已通过、发布说明已生成。"
          echo "未创建 tag / Release，也未部署站点。"
          echo
          echo "=== 本次演练收集到的产物 ==="
          ls -lh release-assets/

  # ============================================================
  # 5. 站点部署
  # ============================================================
  deploy-site:
    # dry run 不得触碰线上：站点部署同样要跳过
    if: ${{ github.event.inputs.dry_run != 'true' }}
    needs: [release]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 站点元信息单源在 site/js/config.js；部署时以本次 Release 为准
      # 现场改写版本号与发布日期，不回写仓库——部署产物永远与 Release 严格一致
      - name: Sync site config with released version
        run: |
          VERSION=$(grep '^hmp.versionName=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          RELEASED=$(gh release view "v${VERSION}" --repo "${{ github.repository }}" \
            --json publishedAt --jq '.publishedAt' | cut -d'T' -f1)
          if [ -z "$RELEASED" ] || [ "$RELEASED" = "null" ]; then
            RELEASED=$(date -u +%F)
            echo "::warning::Release v${VERSION} not found, falling back to today's date"
          fi
          sed -i "s/^  version: '.*',/  version: '${VERSION}',/" site/js/config.js
          sed -i "s/^  released: '.*',/  released: '${RELEASED}',/" site/js/config.js
          echo "Site config synced: v${VERSION} (${RELEASED})"
          grep -E "version:|released:" site/js/config.js
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4