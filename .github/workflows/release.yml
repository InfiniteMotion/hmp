name: Release

on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip publish)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  # 新 push 取代旧的 run：false 会让一个挂死的 run 堵住后续所有发版尝试
  cancel-in-progress: true

jobs:
  # ============================================================
  # 1. 校验：版本号与发布一致性（单元测试不在 CI 跑，见 TODO R31）
  # ============================================================
  validate:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.merged == true
          && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    # 保留上限作保险：validate 曾静默挂死 1 小时无输出（testAll 已从本 job 移除，成因未结案）
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check version & release consistency
        run: ./gradlew checkVersion checkReleaseConsistency --no-daemon --no-configuration-cache

      - name: Cleanup Gradle/Kotlin daemons
        if: always()
        shell: bash   # 统一 shell：Windows 默认 pwsh 会把 `> /dev/null` 当成 D:\dev\null 去写，直接失败
        run: |
          ./gradlew --stop || true
          case "$RUNNER_OS" in
            # Git Bash 里没有 pkill，Windows 用 taskkill；//F 是 MSYS 的转义写法
            Windows) taskkill //F //IM java.exe //T >/dev/null 2>&1 || true ;;
            *) pkill -f 'GradleDaemon|KotlinCompileDaemon|GradleWorkerMain' || true ;;
          esac

  # ============================================================
  # 2. Android 构建（与桌面端并行）
  # ============================================================
  build-android:
    needs: [validate]
    runs-on: ubuntu-latest
    env:
      HMP_BUILD_TARGET: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/hmp-unified-key.jks

      - name: Inject built-in AI API key
        run: echo "BUILT_IN_AI_API_KEY=${{ secrets.BUILT_IN_AI_API_KEY }}" >> gradle.properties

      - name: Build Android Release
        run: ./gradlew :android:app:assembleRelease :android:app:bundleRelease --no-daemon --no-configuration-cache
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-android
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 5

      - name: Cleanup Gradle/Kotlin daemons
        if: always()
        shell: bash   # 统一 shell：Windows 默认 pwsh 会把 `> /dev/null` 当成 D:\dev\null 去写，直接失败
        run: |
          ./gradlew --stop || true
          case "$RUNNER_OS" in
            # Git Bash 里没有 pkill，Windows 用 taskkill；//F 是 MSYS 的转义写法
            Windows) taskkill //F //IM java.exe //T >/dev/null 2>&1 || true ;;
            *) pkill -f 'GradleDaemon|KotlinCompileDaemon|GradleWorkerMain' || true ;;
          esac

  # ============================================================
  # 3. 桌面端构建（与 Android 并行）
  # ============================================================
  build-desktop-macos:
    needs: [validate]
    runs-on: macos-latest
    env:
      HMP_BUILD_TARGET: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build macOS DMG
        run: ./gradlew :desktop:app:packageDistributionForCurrentOS '-Phmp.release-build=true' --no-daemon --no-configuration-cache

      - name: Verify FFmpeg inside DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(ls desktop/app/build/compose/binaries/main/dmg/*.dmg | head -1)
          mp=$(mktemp -d)
          # 装包而不是只看 app image：injectFFmpeg 若排在 packageDmg 之后，image 里有、DMG 里没有，
          # 正是上一版「CI 全绿但用户拿到缺解码器的包」的形态。
          hdiutil attach -nobrowse -readonly -mountpoint "$mp" "$dmg" >/dev/null
          trap 'hdiutil detach -force "$mp" || true' EXIT
          find "$mp" -type f -name 'ffmpeg*' -print | grep -q . \
            || { echo "!! DMG 内没有 FFmpeg：$dmg"; exit 1; }

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-desktop-macos
          path: desktop/app/build/compose/binaries/main/dmg/
          retention-days: 5

      - name: Cleanup Gradle/Kotlin daemons
        if: always()
        shell: bash   # 统一 shell：Windows 默认 pwsh 会把 `> /dev/null` 当成 D:\dev\null 去写，直接失败
        run: |
          ./gradlew --stop || true
          case "$RUNNER_OS" in
            # Git Bash 里没有 pkill，Windows 用 taskkill；//F 是 MSYS 的转义写法
            Windows) taskkill //F //IM java.exe //T >/dev/null 2>&1 || true ;;
            *) pkill -f 'GradleDaemon|KotlinCompileDaemon|GradleWorkerMain' || true ;;
          esac

  build-desktop-windows:
    needs: [validate]
    runs-on: windows-latest
    env:
      HMP_BUILD_TARGET: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install WiX Toolset
        run: choco install wixtoolset -y

      - name: Build Windows MSI
        run: ./gradlew :desktop:app:packageDistributionForCurrentOS '-Phmp.release-build=true' --no-daemon --no-configuration-cache

      - name: Verify FFmpeg inside app image
        shell: bash
        run: |
          set -euo pipefail
          # MSI 是对 app image 目录的整目录收割，查 image 即可（解包 msi 要 dark，路径不稳定）。
          find desktop/app/build/compose/binaries/main/app -type f -iname 'ffmpeg.exe' -print \
            | grep -q . || { echo "!! app image 内没有 ffmpeg.exe"; exit 1; }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-desktop-windows
          path: desktop/app/build/compose/binaries/main/msi/
          retention-days: 5

      - name: Cleanup Gradle/Kotlin daemons
        if: always()
        shell: bash   # 统一 shell：Windows 默认 pwsh 会把 `> /dev/null` 当成 D:\dev\null 去写，直接失败
        run: |
          ./gradlew --stop || true
          case "$RUNNER_OS" in
            # Git Bash 里没有 pkill，Windows 用 taskkill；//F 是 MSYS 的转义写法
            Windows) taskkill //F //IM java.exe //T >/dev/null 2>&1 || true ;;
            *) pkill -f 'GradleDaemon|KotlinCompileDaemon|GradleWorkerMain' || true ;;
          esac

  build-desktop-linux:
    needs: [validate]
    runs-on: ubuntu-latest
    env:
      HMP_BUILD_TARGET: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y dpkg fakeroot

      - name: Build Linux DEB + AppImage
        run: ./gradlew :desktop:app:packageDistributionForCurrentOS '-Phmp.release-build=true' --no-daemon --no-configuration-cache

      - name: Verify FFmpeg inside deb
        shell: bash
        run: |
          set -euo pipefail
          deb=$(ls desktop/app/build/compose/binaries/main/deb/*.deb | head -1)
          # 纯列表比对，不挂载、不解包，无 fuse 依赖。
          dpkg -c "$deb" | grep -E '/bin/ffmpeg$' \
            || { echo "!! deb 内没有 FFmpeg：$deb"; exit 1; }

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-desktop-linux
          path: |
            desktop/app/build/compose/binaries/main/deb/
            desktop/app/build/compose/binaries/main/appimage/
          retention-days: 5

      - name: Cleanup Gradle/Kotlin daemons
        if: always()
        shell: bash   # 统一 shell：Windows 默认 pwsh 会把 `> /dev/null` 当成 D:\dev\null 去写，直接失败
        run: |
          ./gradlew --stop || true
          case "$RUNNER_OS" in
            # Git Bash 里没有 pkill，Windows 用 taskkill；//F 是 MSYS 的转义写法
            Windows) taskkill //F //IM java.exe //T >/dev/null 2>&1 || true ;;
            *) pkill -f 'GradleDaemon|KotlinCompileDaemon|GradleWorkerMain' || true ;;
          esac

  # ============================================================
  # 4. 发布：收集产物 + 生成 Notes + 创建 Release
  # ============================================================
  release:
    needs: [build-android, build-desktop-macos, build-desktop-windows, build-desktop-linux]
    if: ${{ github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^hmp.versionName=' gradle.properties | cut -d'=' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect and rename artifacts
        id: assets
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          mkdir -p release-assets

          # Android
          APK=$(find artifacts/build-android -name "app-release.apk" 2>/dev/null | head -1)
          [ -n "$APK" ] && cp "$APK" "release-assets/HMP-v${VERSION}-release.apk"
          AAB=$(find artifacts/build-android -name "app-release.aab" 2>/dev/null | head -1)
          [ -n "$AAB" ] && cp "$AAB" "release-assets/HMP-v${VERSION}-release.aab"

          # macOS
          for f in artifacts/build-desktop-macos/*.dmg; do
            [ -f "$f" ] && cp "$f" "release-assets/HMP-v${VERSION}-macos.dmg"
          done

          # Windows
          for f in artifacts/build-desktop-windows/*.msi; do
            [ -f "$f" ] && cp "$f" "release-assets/HMP-v${VERSION}-windows.msi"
          done

          # Linux
          DEB=$(find artifacts/build-desktop-linux -name "*.deb" 2>/dev/null | head -1)
          [ -n "$DEB" ] && cp "$DEB" "release-assets/HMP-v${VERSION}-linux.deb"
          APPIMAGE=$(find artifacts/build-desktop-linux -name "*.AppImage" 2>/dev/null | head -1)
          [ -n "$APPIMAGE" ] && cp "$APPIMAGE" "release-assets/HMP-v${VERSION}-linux.AppImage"

          ls -lh release-assets/

      # 上面的收集全是 `[ -f ... ] && cp`，某个平台产物缺失时会静默跳过、Release 照样发布成功。
      # 这里做硬断言：必需产物一个都不能少。
      - name: Assert all artifacts present
        run: |
          VERSION=$(grep '^hmp.versionName=' gradle.properties | cut -d'=' -f2)
          missing=0
          for f in "HMP-v${VERSION}-release.apk" "HMP-v${VERSION}-macos.dmg" \
                   "HMP-v${VERSION}-windows.msi" "HMP-v${VERSION}-linux.deb" \
                   "HMP-v${VERSION}-linux.AppImage"; do
            if [ ! -s "release-assets/$f" ]; then
              echo "::error::缺产物：$f"
              missing=1
            fi
          done
          [ "$missing" = "0" ] || { echo "::error::产物不齐全，拒绝发布（宁可不发，也不发一个缺平台的 Release）"; exit 1; }
          echo "OK 五份必需产物齐全"

      - name: Generate SHA256 checksums
        run: |
          cd release-assets
          sha256sum HMP-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Build release notes
        id: notes
        run: |
          VERSION=$(grep '^hmp.versionName=' gradle.properties | cut -d'=' -f2)
          TAG="v${VERSION}"

          # 正文 = ROADMAP 的本次版本条目（单一事实来源）。原来 Notes 只由 commit 前缀
          # 分类生成，与 ROADMAP 各说各话，发布说明里的完成度口径没人负责。
          # 条目里的 `>` 引用块是给内部看的（进度注记、文档指针），不进公开发布说明。
          #
          # 要收录的不只当前版本：上一版代码可能已合入 master 却没发出去（v7.2.0 就是这样——
          # PR #34 合并、CI 三平台全挂、没有 tag），只抽当前条目会给用户一份不含 Agent 化的
          # 说明。故取 ROADMAP 里所有「比最新 tag 更新」的条目，倒序（最新在前）拼接。
          #
          # 注意：旧实现在循环开头写了 `[ "$v" != "$LATEST" ] || break` —— 当前版本号必然
          # 不等于 LATEST，所以**第一个条目就把循环断掉**，正文恒为空（发布说明只剩产物表）。
          # 这里改为只在遇到旧条目时跳出，并且只收录**有实质内容**的条目：纯「换号再试一次」
          # 的条目由人在标题行写「承接 v…」标记，据此跳过，否则正文会被几段几乎相同的字占满。
          LATEST=$(git tag --sort=-v:refname | head -1 | sed 's/^v//')
          [ -z "$LATEST" ] && LATEST="0.0.0"
          {
            echo "## Hearable Music Player ${TAG}"
            echo
            for v in $(grep -oE '^### v[0-9]+\.[0-9]+\.[0-9]+' ROADMAP.md | sed 's/^### v//' | sort -V -r); do
              # 已发布过的版本（<= 最新 tag）到此为止
              [ "$(printf '%s\n%s\n' "$LATEST" "$v" | sort -V | tail -1)" = "$v" ] || break
              # 取该条目（含标题行本身，便于识别「换号重发」标记；输出时再删掉标题行）
              entry=$(awk -v head="### v${v}" '
                index($0, head)==1 { f=1; print; next }
                f && (/^### v[0-9]/ || /^## /) { exit }
                f
              ' ROADMAP.md)
              # 纯换号条目（无新增内容）不进正文。标记只写在标题行上，故先看第一行——正文要点
              # 里出现同样的词也不会误判当前版本。
              if printf '%s\n' "$entry" | head -1 | grep -q '承接 v'; then
                echo "（v${v} 为换号重发，内容并入本版，略）" >&2
                continue
              fi
              echo "#### v${v}"
              echo
              printf '%s\n' "$entry" | tail -n +2
            done
          } | grep -v '^> ' > body.md

          # 产物表与 iOS 口径追加在正文之后（不过滤 `>` 行）
          cat >> body.md <<TABLE

          ---

          ### 📥 产物
          | 平台 | 文件 |
          |------|------|
          | Android | \`HMP-v${VERSION}-release.apk\`（\`.aab\` 走 Google Play） |
          | macOS | \`HMP-v${VERSION}-macos.dmg\` |
          | Windows | \`HMP-v${VERSION}-windows.msi\` |
          | Linux | \`HMP-v${VERSION}-linux.deb\` / \`.AppImage\` |
          | 校验和 | \`SHA256SUMS.txt\`（\`sha256sum -c SHA256SUMS.txt\`） |

          > iOS 不随本次发布提供安装包：需 macOS + Xcode 源码自构建，见 README「安装步骤」。
          TABLE

          # commit 分类降级为附录
          PREV_TAG=$(git tag --sort=-v:refname | head -1)
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "$PREV_TAG..HEAD" --pretty=format:"%s" --no-merges)
          else
            COMMITS="Initial release"
          fi
          FEATURES=$(echo "$COMMITS" | grep -iE "^(feat|feature)" | sed 's/^/- /' || true)
          FIXES=$(echo "$COMMITS" | grep -iE "^fix" | sed 's/^/- /' || true)
          PERF=$(echo "$COMMITS" | grep -iE "^(perf|optimize|refactor)" | sed 's/^/- /' || true)
          OTHERS=$(echo "$COMMITS" | grep -viE "^(feat|feature|fix|perf|optimize|refactor)" | sed 's/^/- /' || true)
          {
            echo
            echo "---"
            echo
            echo "### 工程提交（附录，自动生成）"
            [ -n "$FEATURES" ] && echo "#### ✨ Features" && echo "$FEATURES" && echo ""
            [ -n "$FIXES" ] && echo "#### 🐛 Fixes" && echo "$FIXES" && echo ""
            [ -n "$PERF" ] && echo "#### ⚡ Performance & Refactoring" && echo "$PERF" && echo ""
            [ -n "$OTHERS" ] && echo "#### 📦 Other" && echo "$OTHERS" && echo ""
          } > appendix.md
          wc -l body.md appendix.md

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^hmp.versionName=' gradle.properties | cut -d'=' -f2)
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 幂等：原来先 git tag 再 gh release create，任一步中途失败后重跑必死于
          # "tag already exists"，只能人工删 tag。现在存在即复用。
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "tag ${TAG} 已存在 → 复用（通常是上次发布中途失败后重跑）"
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

          cat body.md appendix.md > notes.md

          if gh release view "${TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "${TAG}" --repo "$GITHUB_REPOSITORY" --title "${TAG}" --notes-file notes.md
            gh release upload "${TAG}" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "${TAG}" --repo "$GITHUB_REPOSITORY" --title "${TAG}" \
              --notes-file notes.md release-assets/*
          fi

  # ============================================================
  # 5. 站点部署
  # ============================================================
  deploy-site:
    needs: [release]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 站点元信息单源在 site/js/config.js；部署时以本次 Release 为准
      # 现场改写版本号与发布日期，不回写仓库——部署产物永远与 Release 严格一致
      - name: Sync site config with released version
        run: |
          VERSION=$(grep '^hmp.versionName=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          RELEASED=$(gh release view "v${VERSION}" --repo "${{ github.repository }}" \
            --json publishedAt --jq '.publishedAt' | cut -d'T' -f1)
          if [ -z "$RELEASED" ] || [ "$RELEASED" = "null" ]; then
            RELEASED=$(date -u +%F)
            echo "::warning::Release v${VERSION} not found, falling back to today's date"
          fi
          sed -i "s/^  version: '.*',/  version: '${VERSION}',/" site/js/config.js
          sed -i "s/^  released: '.*',/  released: '${RELEASED}',/" site/js/config.js
          echo "Site config synced: v${VERSION} (${RELEASED})"
          grep -E "version:|released:" site/js/config.js
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4