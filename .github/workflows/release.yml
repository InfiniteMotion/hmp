name: Release

on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip publish)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  # 新 push 取代旧的 run：false 会让一个挂死的 run 堵住后续所有发版尝试
  cancel-in-progress: true

jobs:
  # ============================================================
  # 1. 校验：版本号与发布一致性（单元测试不在 CI 跑，见 TODO R31）
  # ============================================================
  validate:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.merged == true
          && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    # 保留上限作保险：validate 曾静默挂死 1 小时无输出（testAll 已从本 job 移除，成因未结案）
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # checkReleaseConsistency 现在委托 scripts/sync-release.py（版本真源 release.toml），
      # 所以这个 job 也需要确定版本的 Python，而不是赌镜像里预装了什么。
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 版本校验只留一处实现：Gradle 任务 → 脚本 → release.toml。
      # 原先这里是第二套内联实现：规则与 checkVersion 不一致（只比最新 tag、不比 versionCode
      # 自洽与递增），且完全不管 iOS/站点声明是否跟上。
      - name: Check version & release consistency
        run: ./gradlew checkVersion checkReleaseConsistency --no-daemon --no-configuration-cache

      - name: Cleanup Gradle/Kotlin daemons
        if: always()
        shell: bash   # 统一 shell：Windows 默认 pwsh 会把 `> /dev/null` 当成 D:\dev\null 去写，直接失败
        run: |
          ./gradlew --stop || true
          case "$RUNNER_OS" in
            # Git Bash 里没有 pkill，Windows 用 taskkill；//F 是 MSYS 的转义写法
            Windows) taskkill //F //IM java.exe //T >/dev/null 2>&1 || true ;;
            *) pkill -f 'GradleDaemon|KotlinCompileDaemon|GradleWorkerMain' || true ;;
          esac

  # ============================================================
  # 2. Android 构建（与桌面端并行）
  # ============================================================
  build-android:
    needs: [validate]
    runs-on: ubuntu-latest
    env:
      HMP_BUILD_TARGET: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/hmp-unified-key.jks

      - name: Inject built-in AI API key
        run: echo "BUILT_IN_AI_API_KEY=${{ secrets.BUILT_IN_AI_API_KEY }}" >> gradle.properties

      - name: Build Android Release
        run: ./gradlew :android:app:assembleRelease :android:app:bundleRelease --no-daemon --no-configuration-cache
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-android
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 5

      - name: Cleanup Gradle/Kotlin daemons
        if: always()
        shell: bash   # 统一 shell：Windows 默认 pwsh 会把 `> /dev/null` 当成 D:\dev\null 去写，直接失败
        run: |
          ./gradlew --stop || true
          case "$RUNNER_OS" in
            # Git Bash 里没有 pkill，Windows 用 taskkill；//F 是 MSYS 的转义写法
            Windows) taskkill //F //IM java.exe //T >/dev/null 2>&1 || true ;;
            *) pkill -f 'GradleDaemon|KotlinCompileDaemon|GradleWorkerMain' || true ;;
          esac

  # ============================================================
  # 3. 桌面端构建（与 Android 并行）
  # ============================================================
  build-desktop-macos:
    needs: [validate]
    runs-on: macos-latest
    env:
      HMP_BUILD_TARGET: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build macOS DMG
        run: ./gradlew :desktop:app:packageDistributionForCurrentOS '-Phmp.release-build=true' --no-daemon --no-configuration-cache

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-desktop-macos
          path: desktop/app/build/compose/binaries/main/dmg/
          retention-days: 5

      - name: Cleanup Gradle/Kotlin daemons
        if: always()
        shell: bash   # 统一 shell：Windows 默认 pwsh 会把 `> /dev/null` 当成 D:\dev\null 去写，直接失败
        run: |
          ./gradlew --stop || true
          case "$RUNNER_OS" in
            # Git Bash 里没有 pkill，Windows 用 taskkill；//F 是 MSYS 的转义写法
            Windows) taskkill //F //IM java.exe //T >/dev/null 2>&1 || true ;;
            *) pkill -f 'GradleDaemon|KotlinCompileDaemon|GradleWorkerMain' || true ;;
          esac

  build-desktop-windows:
    needs: [validate]
    runs-on: windows-latest
    env:
      HMP_BUILD_TARGET: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset -y
          # choco 改的是机器 PATH，需显式灌进 GITHUB_PATH 才能让后续 build 步骤找到 candle/light。
          # 用通配定位，避免写死 v3.11 路径。
          $wixBin = (Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" -Recurse -Filter candle.exe -ErrorAction SilentlyContinue |
                     Select-Object -First 1).DirectoryName
          if (-not $wixBin) { throw "WiX candle.exe 未找到，MSI 打包必失败" }
          echo "$wixBin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          Write-Host "WiX bin on PATH: $wixBin"

      - name: Build Windows MSI
        shell: bash
        run: ./gradlew :desktop:app:packageDistributionForCurrentOS '-Phmp.release-build=true' --no-daemon --no-configuration-cache

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-desktop-windows
          path: desktop/app/build/compose/binaries/main/msi/
          retention-days: 5

      - name: Cleanup Gradle/Kotlin daemons
        if: always()
        shell: bash   # 统一 shell：Windows 默认 pwsh 会把 `> /dev/null` 当成 D:\dev\null 去写，直接失败
        run: |
          ./gradlew --stop || true
          case "$RUNNER_OS" in
            # Git Bash 里没有 pkill，Windows 用 taskkill；//F 是 MSYS 的转义写法
            Windows) taskkill //F //IM java.exe //T >/dev/null 2>&1 || true ;;
            *) pkill -f 'GradleDaemon|KotlinCompileDaemon|GradleWorkerMain' || true ;;
          esac

  build-desktop-linux:
    needs: [validate]
    runs-on: ubuntu-latest
    env:
      HMP_BUILD_TARGET: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: |
          # dpkg/fakeroot：jpackage 打 deb 的硬依赖（需要 dpkg-deb 做归档）
          # 这里不用装 appimagetool / libfuse2 —— Compose 从不调用它，
          # TargetFormat.AppImage 也不是 Linux AppImage，见 desktop/app/build.gradle.kts。
          sudo apt-get update
          sudo apt-get install -y dpkg fakeroot

      - name: Build Linux DEB
        run: ./gradlew :desktop:app:packageDistributionForCurrentOS '-Phmp.release-build=true' --no-daemon --no-configuration-cache

      # v7.2.1 首发时这一步找不到 AppImage 而失败。根因不在路径：Compose 的
      # TargetFormat.AppImage 产出的是解包目录，永远不会有 .AppImage 文件（详见
      # build.gradle.kts）。本次已把该格式从 Linux 移除，这里只收 deb。
      - name: Collect and verify Linux package
        run: |
          set -euo pipefail
          MAIN=desktop/app/build/compose/binaries/main

          echo "=== main/ 实际布局（诊断）==="
          find "$MAIN" -maxdepth 2 \( -type d -o -type f \) | sort
          echo

          # -quit 而非 | head -1：后者会让 find 收到 SIGPIPE，在 pipefail 下直接判失败
          DEB=$(find "$MAIN" -type f -name '*.deb' -print -quit 2>/dev/null || true)
          [ -n "$DEB" ] || { echo "::error::未找到 .deb"; exit 1; }

          # deb 里必须有 ffmpeg。FFmpeg 的注入点是 jlink runtime image，而它是否真被
          # jpackage 带进 deb，此前没人验过 —— 这正是三端缺 ffmpeg 长期没人发现的原因。
          # dpkg-deb -c 输的是 deb 内清单，最后一段是路径。
          #
          # 关键：必须先把清单落盘再 grep，不能 `dpkg-deb -c | grep -q`。
          # grep -q 匹配到就立即退出并关闭管道，tar 随之收到 SIGPIPE 写失败、
          # dpkg-deb 以 2 退出；叠加 pipefail 后整条管道判红，于是「找到了」被误判成
          # 「没找到」，本来正常的 deb 反而让 job 失败（2026-09-25 实测）。
          echo "=== deb 内 ffmpeg 核查 ==="
          CONTENTS=$(mktemp)
          dpkg-deb -c "$DEB" > "$CONTENTS"
          if ! grep -Eq '/bin/ffmpeg$' "$CONTENTS"; then
            echo "::error::DEB 内未包含 ffmpeg：$DEB"
            grep -iE 'bin|runtime' "$CONTENTS" || true
            exit 1
          fi
          grep -E '/bin/ffmpeg$' "$CONTENTS"

          mkdir -p linux-out
          cp "$DEB" linux-out/
          echo "=== 将上传 ==="
          ls -lh linux-out/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-desktop-linux
          path: linux-out/
          retention-days: 5

      - name: Cleanup Gradle/Kotlin daemons
        if: always()
        shell: bash   # 统一 shell：Windows 默认 pwsh 会把 `> /dev/null` 当成 D:\dev\null 去写，直接失败
        run: |
          ./gradlew --stop || true
          case "$RUNNER_OS" in
            # Git Bash 里没有 pkill，Windows 用 taskkill；//F 是 MSYS 的转义写法
            Windows) taskkill //F //IM java.exe //T >/dev/null 2>&1 || true ;;
            *) pkill -f 'GradleDaemon|KotlinCompileDaemon|GradleWorkerMain' || true ;;
          esac

  # ============================================================
  # 4. 发布：收集产物 + 生成 Notes + 创建 Release
  # ============================================================
  release:
    needs: [build-android, build-desktop-macos, build-desktop-windows, build-desktop-linux]
    # 刻意不再让 dry_run 整个跳过本 job。
    # v7.2.1 事故的一半原因在这里：dry run 跳过 release job，于是「收集产物 + 齐全断言」
    # 这段逻辑从来没被演练过 —— dry run 全绿，正式发布才第一次跑到断言才发现 AppImage 丢了。
    # 现在 dry run 会一路跑到断言与 Notes 生成为止，只在落地 tag / Release 那一步停下。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 版本与发布文案的真源是 release.toml，解释它的是 scripts/sync-release.py。
      # 这里固定 Python 版本：脚本用内置 tomllib（3.11+），不赌 runner 镜像里装了什么。
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: version
        run: echo "VERSION=$(python scripts/sync-release.py version)" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect and rename artifacts
        # 目标文件名与来源 glob 都在 release.toml 的 [[artifact]] 里 —— 工作流不再抄一份，
        # 平台增减只改配置一处（历史上这两份不一致，留下了指向不存在资产的下载键）。
        run: python scripts/sync-release.py collect --src artifacts --dst release-assets

      - name: Generate SHA256 checksums
        run: |
          cd release-assets
          sha256sum HMP-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # 上面的收集全是 `[ -f ... ] && cp`，某个平台产物缺失时会静默跳过、Release 照样发布成功。
      # 硬断言的名单逐个取自 release.toml（含校验和文件），不在工作流里抄第二份文件名 ——
      # 之前站点下载键就是这么和实际产物脱钩的（appimage 死链）。
      - name: Assert all artifacts present
        run: |
          missing=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ ! -s "release-assets/$f" ]; then
              echo "::error::缺产物：$f"
              missing=1
            fi
          done < <(python scripts/sync-release.py assets)
          [ "$missing" = "0" ] || { echo "::error::产物不齐全，拒绝发布（宁可不发，也不发一个缺平台的 Release）"; exit 1; }
          echo "OK 必需产物齐全：$(python scripts/sync-release.py assets | tr '\n' ' ')"

      - name: Build release notes
        id: notes
        run: |
          # 正文由 scripts/sync-release.py 从 release.toml 渲染（对外文案 + 产物表都在那份配置里）。
          # 这里曾经是用 awk 从 ROADMAP 抽散文：ROADMAP 的版本条目升序写，最新那条后面没有
          # `### v` 边界，抽取一路冲到 EOF，v7.2.1 把 172 行内部章节灌进了公开 Notes（发布后靠人删）。
          # 散文从此不再被解析；空文案 / 超 80 条由脚本判据拦住，判据要改得在人这边改。
          python scripts/sync-release.py notes --out body.md
          wc -l body.md
          # 正式发布也把正文打进日志：v7.2.1 那次 172 行内部章节泄到公开 Notes，
          # 就是因为发布时没有任何地方让人看到最终正文。
          echo "=== 将要公开的发布说明正文 ==="
          cat body.md
          echo "=== 正文结束 ==="

          # commit 分类降级为附录
          PREV_TAG=$(git tag --sort=-v:refname | head -1)
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "$PREV_TAG..HEAD" --pretty=format:"%s" --no-merges)
          else
            COMMITS="Initial release"
          fi
          FEATURES=$(echo "$COMMITS" | grep -iE "^(feat|feature)" | sed 's/^/- /' || true)
          FIXES=$(echo "$COMMITS" | grep -iE "^fix" | sed 's/^/- /' || true)
          PERF=$(echo "$COMMITS" | grep -iE "^(perf|optimize|refactor)" | sed 's/^/- /' || true)
          OTHERS=$(echo "$COMMITS" | grep -viE "^(feat|feature|fix|perf|optimize|refactor)" | sed 's/^/- /' || true)
          {
            echo
            echo "---"
            echo
            echo "### 工程提交（附录，自动生成）"
            [ -n "$FEATURES" ] && echo "#### ✨ Features" && echo "$FEATURES" && echo ""
            [ -n "$FIXES" ] && echo "#### 🐛 Fixes" && echo "$FIXES" && echo ""
            [ -n "$PERF" ] && echo "#### ⚡ Performance & Refactoring" && echo "$PERF" && echo ""
            [ -n "$OTHERS" ] && echo "#### 📦 Other" && echo "$OTHERS" && echo ""
          } > appendix.md
          wc -l body.md appendix.md

      - name: Create tag and GitHub Release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 幂等：原来先 git tag 再 gh release create，任一步中途失败后重跑必死于
          # "tag already exists"，只能人工删 tag。现在存在即复用。
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "tag ${TAG} 已存在 → 复用（通常是上次发布中途失败后重跑）"
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

          cat body.md appendix.md > notes.md

          if gh release view "${TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "${TAG}" --repo "$GITHUB_REPOSITORY" --title "${TAG}" --notes-file notes.md
            gh release upload "${TAG}" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "${TAG}" --repo "$GITHUB_REPOSITORY" --title "${TAG}" \
              --notes-file notes.md release-assets/*
          fi

      # dry run 的终点：收集、断言、Notes 都已真实跑过，到此收手。
      # 这里贴出产物清单，让人一眼确认「只差发布」。
      - name: Dry run — stop before publishing
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "dry_run=true：产物齐全断言已通过、发布说明已生成。"
          echo "未创建 tag / Release，也未部署站点。"
          echo
          echo "=== 将要公开的发布说明正文（与正式发布同源同一段渲染）==="
          cat body.md
          echo "=== 正文结束 ==="
          echo
          echo "=== 本次演练收集到的产物 ==="
          ls -lh release-assets/

  # ============================================================
  # 5. 站点部署
  # ============================================================
  deploy-site:
    # dry run 不得触碰线上：站点部署同样要跳过
    if: ${{ github.event.inputs.dry_run != 'true' }}
    needs: [release]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 站点元信息单源在 site/js/config.js；部署时以本次 Release 为准
      # 现场改写版本号与发布日期，不回写仓库——部署产物永远与 Release 严格一致
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 站点版本与发布日期的真源是 release.toml，提交时已由 syncVersion 写进 config.js。
      # 这里不再 sed 改写部署副本 —— 那会让"线上站点"与"仓库内容"静默不一致；
      # 改成核对：漂移就让这一步红，日期填错只警告不擅自改。
      - name: Verify site config matches release.toml
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/sync-release.py sync --check
          VERSION=$(python scripts/sync-release.py version)
          echo "站点声明：$(grep -E '^  (version|released):' site/js/config.js | tr -d '\n')"
          ACTUAL=$(gh release view "v${VERSION}" --repo "${{ github.repository }}" \
            --json publishedAt --jq '.publishedAt' | cut -d'T' -f1)
          DECL=$(sed -n "s/^  released: '\([^']*\)'.*/\1/p" site/js/config.js)
          if [ -n "$ACTUAL" ] && [ "$ACTUAL" != "null" ] && [ "$ACTUAL" != "$DECL" ]; then
            echo "::warning::release.toml 的 date=$DECL 与实际发布日 $ACTUAL 不符，请回填后重跑 syncVersion"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4