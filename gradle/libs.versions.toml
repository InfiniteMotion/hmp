[versions]
agp = "9.0.0"
# Kotlin 2.3.x（2026-08）：navigation3 全系 iOS klib 由 2.3 编译器产出（google runtime ≥1.1.1 → 2.3.10，
# JetBrains navigation3-ui 全版本 → 2.3.20），2.2.21 无法消费其 ABI；KSP 亦已切换 2.3.x 顺序版本。
# 本机 ~/.konan 已有 kotlin-native-prebuilt-2.3.21。
kotlin = "2.3.21"
kotlinxCoroutines = "1.10.1"
serialization = "1.7.3"
ksp = "2.3.11"
coreKtx = "1.15.0"
lifecycleRuntimeKtx = "2.10.0"

roomVersion = "2.8.3"
runtimeLivedata = "1.9.4"
datastorePreferences = "1.1.7"

foundation = "1.9.4"
activityCompose = "1.8.2"
composeBom = "2025.11.00"
navigation = "2.9.6"
nav3Version = "1.1.1"
material3 = "1.2.1"
loggingInterceptor = "4.12.0"

media3 = "1.8.0"
paletteKtx = "1.0.0"
gson = "2.10.1"
coilCompose = "2.7.0"
coilComposeKmp = "3.3.0"
navigationKmp = "2.9.2"
converterGson = "2.9.0"
jaudiotagger = "3.0.1"
okhttp = "4.12.0"
cronetEmbedded = "119.6045.31"

junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
material3Version = "1.4.0"
mockk = "1.13.13"
coroutinesTest = "1.9.0"
turbine = "1.2.0"
mockwebserver = "4.12.0"
archCoreTesting = "2.2.0"
robolectric = "4.14.1"
animation = "1.10.0"
haze = "1.7.2"
uiGraphics = "1.10.2"
animationCore = "1.10.4"
material3Adaptive = "1.2.0"

koin = "4.2.2"
ktor = "3.1.1"
sqlite = "2.6.1"
composeMultiplatform = "1.9.3"
# CMP 1.9 起 Material3 版本与 CMP 解耦（decoupled versioning）：material3 独立发版，1.9.0 基于 Jetpack Material3 1.4.0
composeMaterial3 = "1.9.0"

# JetBrains 分发的 KMP 版（依赖替换用，见 docs/shared-ui-extract/方案.md §2.2）
# navigation3：JetBrains 只分发 UI（runtime 用 google 坐标 androidx.navigation3，其本身即 KMP）
# Kotlin 升至 2.3.21 后恢复 1.1.1（与 shared-ui 代码编写时一致；runtime 同步对齐 1.1.1，
# 避免 nav3-ui 传递升级产生解析漂移；iOS klib ABI 2.3.0 由 2.3.21 编译器消费）。
# lifecycle：viewmodel-navigation3 最低 2.10.0（JetBrains 官方 CMP 文档推荐组合）
jetbrainsNavigation3 = "1.1.1"
jetbrainsLifecycle = "2.10.0"
jetbrainsMaterial3Adaptive = "1.2.0"

[libraries]
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastorePreferences" }
androidx-media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
