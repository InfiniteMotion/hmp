jetbrains-compose-animation = { module = "org.jetbrains.compose.animation:animation", version.ref = "composeMultiplatform" }

# navigation3 / lifecycle / material3-adaptive 的 JetBrains KMP 分发版（包名保持 androidx.*）
# 注：navigation3-runtime 无 JetBrains 分发（JetBrains 只分发 UI），用 google 坐标 androidx-navigation3-runtime（本身即 KMP）
jetbrains-navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "jetbrainsNavigation3" }
jetbrains-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "jetbrainsLifecycle" }
