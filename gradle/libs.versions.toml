jetbrains-material3-adaptive-layout = { module = "org.jetbrains.compose.material3.adaptive:adaptive-layout", version.ref = "jetbrainsMaterial3Adaptive" }
jetbrains-material3-adaptive-navigation = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation", version.ref = "jetbrainsMaterial3Adaptive" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
