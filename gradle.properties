# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dhttps.protocols=TLSv1.2,TLSv1.3 -Djdk.tls.client.protocols=TLSv1.2,TLSv1.3
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.unsafe.configuration-cache=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
# Allow Kotlin source sets with built-in Kotlin for KSP compatibility
android.disallowKotlinSourceSets=false
# Build Tools configuration
android.buildToolsVersion=36.0.0
# AGP 9.0+ configuration
android.experimental.gradle.outputPerfEnabled=true
android.experimental.gradle.cacheRedirectEnabled=true
# Gradle toolchain configuration
toolchain.java.version=21
# Disable auto-download, use locally installed JDK
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.fromEnv=JAVA_HOME
# ---------------- Desktop JDK 21 Configuration ----------------
# The Compose Desktop plugin uses the Gradle Daemon JVM to execute jpackage/jlink.
# For this reason, the Gradle Daemon must run on JDK 21.
# Otherwise, the installed MSI package will fail to launch with
# UnsupportedClassVersionError (class version 65 vs 61).
#
# Add the line below to your user-level ~/.gradle/gradle.properties,
# replace the path with your local JDK 21 installation directory:
#
#   org.gradle.java.home=C:\\path\\to\\your\\jdk-21
#
# Locate auto-downloaded JDK 21 (Gradle Toolchain automatic download):
#   Windows: dir %USERPROFILE%\.gradle\jdks\
#   macOS/Linux: ls ~/.gradle/jdks/
#
# Verify the configuration is applied:
#   ./gradlew --version  Daemon JVM should display the JDK 21 path
#
# This setting is for local development only. Do NOT commit it to repository
# git update-index --assume-unchanged gradle.properties
# restore git update-index --no --assume-unchanged gradle.properties

# org.gradle.java.home=

# Network optimization
org.gradle.connection.timeout=60000
org.gradle.socket.timeout=60000
org.gradle.download.parallel=true
org.gradle.download.concurrent=4
# Release version (centralized, referenced by modules)
hmp.versionCode=72003
hmp.versionName=7.2.3
# Built-in AI API Key (free trial / paid mode)
# Local dev: fill in your key (do NOT commit)
# CI: injected by GitHub Actions secrets
BUILT_IN_AI_ENDPOINT=https://api.deepseek.com/v1
BUILT_IN_AI_API_KEY=
BUILT_IN_AI_MODEL=deepseek-chat
# Skip JDK vendor check for desktop packaging (Homebrew JDK works fine)
compose.desktop.packaging.checkJdkVendor=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
