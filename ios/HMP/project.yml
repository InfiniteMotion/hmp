name: HMP
options:
  bundleIdPrefix: com.hearablemusic
  deploymentTarget:
    iOS: "26.3"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "6MWD22QB9Z"

targets:
  HMP:
    type: application
    platform: iOS
    sources:
      - path: HMP
        excludes:
          - "**/.DS_Store"
    info:
      path: HMP/Info.plist
      properties:
        CFBundleDisplayName: HMP
        CFBundleShortVersionString: "7.2.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppleMusicUsageDescription: "HMP 需要访问您的音乐库以便扫描和管理音乐文件"
        UIBackgroundModes:
          - audio
        # 锁屏 / Dynamic Island 实时活动（LiveActivityManager 依赖；v7.1 曾被误删）
        NSSupportsLiveActivities: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Compose Multiplatform iOS 要求（高刷屏性能），缺省会触发 PlistSanityCheck 报错
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hearablemusic.HMP
        MARKETING_VERSION: "7.2.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: $(inherited)
    dependencies: []
